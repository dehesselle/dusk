name: Build
on:
  push:
jobs:
  ################################################################################

  msvc_static:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt (statically linked)
        uses: AllanChain/install-qt-static@v6.10.1-3

      - name: Build application
        run: |
          cmake -S . -B build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dusk-msvc_static
          path: build/Release/

  ################################################################################

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Create release assets
        run: zip -r dusk-msvc_static.zip  dusk-msvc_static

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dusk-msvc_*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
